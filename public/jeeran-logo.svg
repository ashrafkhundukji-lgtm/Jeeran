<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <g transform="translate(100, 50)">
    <!-- الأيقونة المركزية المدمجة (ج + J) -->
    <g id="logo-mark" transform="translate(0, 0)">
      <!-- التوهج الخلفي الخفيف لإعطاء لمسة تقنية -->
      <circle cx="180" cy="180" r="140" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="8 8" opacity="0.15"/>
      
      <!-- الخطوط الهندسية المتشابكة للحرفين -->
      <!-- رأس الجيم الممتد ليصبح السقف العلوي لحرف الـ J -->
      <path d="M 100 110 L 260 110" stroke="#1E3A8A" stroke-width="24" stroke-linecap="round"/>
      
      <!-- الانحناء المشترك الذي يشكل بطن الجيم وقوس الـ J السفلي -->
      <path d="M 230 110 C 230 110, 280 180, 230 250 C 180 320, 90 290, 90 220" 
            fill="none" stroke="#1E3A8A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- امتداد إضافي لضبط شكل الـ J الإنجليزي الصاعد -->
      <path d="M 230 110 L 230 180" stroke="#1E3A8A" stroke-width="24" stroke-linecap="round"/>
      
      <!-- نقطة الجيم الذكية المصممة على شكل دبوس موقع (Location Pin) باللون البرتقالي المرجاني -->
      <g id="location-pin-dot" transform="translate(160, 205)">
        <!-- شكل الدبوس -->
        <path d="M 0 0 C -12 -12, -18 -24, -18 -36 C -18 -50, -8 -58, 0 -58 C 8 -58, 18 -50, 18 -36 C 18 -24, 12 -12, 0 0 Z" fill="#FF6B4A"/>
        <!-- النقطة الداخلية البيضاء في الدبوس -->
        <circle cx="0" cy="-36" r="6" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- النص والشعار اللفظي المدمج (Typography) -->
    <g id="logo-text" transform="translate(360, 0)">
      <!-- الكلمة الإنجليزية بخط هندسي نظيف -->
      <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#1E3A8A" letter-spacing="1">Jeeran</text>
      
      <!-- الكلمة العربية بخط كوفي حديث متناغم مع الإنجليزي -->
      <text x="5" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#FF6B4A" letter-spacing="2">جِـيـران</text>
      
      <!-- السطر التعريفي الصغير للشبكة -->
      <text x="5" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#64748B" letter-spacing="4">HYPERLOCAL AD NETWORK</text>
      
      <!-- خط الفصل الجمالي الصغير -->
      <line x1="5" y1="110" x2="280" y2="110" stroke="#FF6B4A" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
