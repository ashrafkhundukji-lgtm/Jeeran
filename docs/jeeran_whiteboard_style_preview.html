<div style="max-width:480px; margin:0 auto; font-family: var(--font-sans);">

  <div style="position:relative; width:100%; aspect-ratio:16/9; background:#FAF9F4; border-radius:16px; overflow:hidden; border:0.5px solid var(--border);">

    <svg width="100%" height="100%" viewBox="0 0 480 270" style="position:absolute; inset:0;">

      <!-- street baseline -->
      <line x1="20" y1="220" x2="460" y2="220" stroke="#1D1B1A" stroke-width="2" fill="none"
        stroke-dasharray="440" stroke-dashoffset="440" style="animation: wb-draw 2s ease-out forwards;"/>

      <!-- shop 1 outline -->
      <g style="animation: wb-fade-in 1s ease-out 1.8s forwards; opacity:0;">
        <rect x="60" y="150" width="70" height="70" fill="none" stroke="#1D1B1A" stroke-width="2"/>
        <polyline points="55,150 95,110 135,150" fill="none" stroke="#1D1B1A" stroke-width="2"/>
        <rect x="80" y="180" width="30" height="40" fill="none" stroke="#1D1B1A" stroke-width="2"/>
      </g>

      <!-- QR stand on shop 1 -->
      <g style="animation: wb-fade-in 1s ease-out 3s forwards; opacity:0;">
        <rect x="115" y="165" width="18" height="18" fill="none" stroke="#D85A30" stroke-width="2"/>
        <line x1="120" y1="170" x2="128" y2="170" stroke="#D85A30" stroke-width="1.5"/>
        <line x1="120" y1="175" x2="128" y2="175" stroke="#D85A30" stroke-width="1.5"/>
        <path d="M 133 174 Q 150 160 165 174" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/>
      </g>

      <!-- shop 2 outline -->
      <g style="animation: wb-fade-in 1s ease-out 4s forwards; opacity:0;">
        <rect x="220" y="160" width="60" height="60" fill="none" stroke="#1D1B1A" stroke-width="2"/>
        <polyline points="216,160 250,125 284,160" fill="none" stroke="#1D1B1A" stroke-width="2"/>
      </g>

      <!-- shop 3 outline -->
      <g style="animation: wb-fade-in 1s ease-out 4.6s forwards; opacity:0;">
        <rect x="340" y="155" width="65" height="65" fill="none" stroke="#1D1B1A" stroke-width="2"/>
        <polyline points="335,155 372,118 410,155" fill="none" stroke="#1D1B1A" stroke-width="2"/>
      </g>

      <!-- phone icon center -->
      <g style="animation: wb-fade-in 1s ease-out 5.2s forwards; opacity:0;">
        <rect x="225" y="70" width="30" height="55" rx="4" fill="none" stroke="#1D1B1A" stroke-width="2"/>
        <line x1="232" y1="118" x2="248" y2="118" stroke="#1D1B1A" stroke-width="2"/>
      </g>

      <!-- dashed connectors from shops to phone -->
      <g style="animation: wb-fade-in 1s ease-out 5.8s forwards; opacity:0;">
        <path d="M 130 165 Q 180 100 225 95" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="M 250 160 Q 245 130 240 125" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="M 372 155 Q 320 100 255 95" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 4"/>
      </g>

    </svg>
  </div>

  <p style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:10px;">Line-draw reveal style — each element sketches in, then settles as clean line art. Loops once; refresh to replay.</p>

</div>

<style>
@keyframes wb-draw {
  to { stroke-dashoffset: 0; }
}
@keyframes wb-fade-in {
  to { opacity: 1; }
}
</style>
