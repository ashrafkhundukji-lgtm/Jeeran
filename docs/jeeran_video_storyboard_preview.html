<div style="max-width:420px; margin:0 auto; font-family: var(--font-sans);">

  <div style="position:relative; width:100%; aspect-ratio:9/16; background:#F2F7FC; border-radius:20px; overflow:hidden; border:0.5px solid var(--border);">

    <svg width="100%" height="100%" viewBox="0 0 300 533" style="position:absolute; inset:0;">
      <defs>
        <pattern id="pv-dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" fill="#DCE8F5"/>
        </pattern>
      </defs>
      <rect width="300" height="533" fill="url(#pv-dots)"/>

      <!-- Scene 1: logo -->
      <g style="animation: pv-fade 12s infinite; opacity:0;">
        <rect x="120" y="220" width="60" height="60" rx="14" fill="#042C53"/>
        <text x="150" y="260" font-family="Arial" font-size="26" font-weight="700" fill="#F0997B" text-anchor="middle">ج</text>
        <text x="150" y="310" font-family="Arial" font-size="20" font-weight="700" fill="#042C53" text-anchor="middle">Jeeran</text>
      </g>

      <!-- Scene 2: shop + QR stand -->
      <g style="animation: pv-fade 12s infinite; animation-delay: 2.4s; opacity:0;">
        <rect x="110" y="240" width="80" height="70" rx="6" fill="#85B7EB"/>
        <rect x="140" y="200" width="20" height="40" fill="#042C53"/>
        <rect x="130" y="255" width="40" height="30" fill="#F2F7FC"/>
        <text x="150" y="360" font-family="Arial" font-size="13" fill="#57544A" text-anchor="middle">Every shop has customers</text>
        <text x="150" y="378" font-family="Arial" font-size="13" fill="#57544A" text-anchor="middle">walking by every day</text>
      </g>

      <!-- Scene 3: scan + wallet -->
      <g style="animation: pv-fade 12s infinite; animation-delay: 4.8s; opacity:0;">
        <rect x="70" y="220" width="50" height="90" rx="10" fill="#1D1B1A"/>
        <rect x="76" y="230" width="38" height="70" fill="#F2F7FC"/>
        <rect x="180" y="200" width="90" height="55" rx="10" fill="#042C53"/>
        <text x="225" y="233" font-family="Arial" font-size="12" font-weight="700" fill="#F0997B" text-anchor="middle">+ Wallet pass</text>
        <line x1="120" y1="255" x2="180" y2="228" stroke="#D85A30" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="150" y="330" font-family="Arial" font-size="13" fill="#57544A" text-anchor="middle">One scan. A free pass.</text>
        <text x="150" y="348" font-family="Arial" font-size="13" fill="#57544A" text-anchor="middle">No app, no signup.</text>
      </g>

      <!-- Scene 4: network map -->
      <g style="animation: pv-fade 12s infinite; animation-delay: 7.2s; opacity:0;">
        <circle cx="90" cy="230" r="10" fill="#97C459"/>
        <circle cx="210" cy="210" r="10" fill="#F0997B"/>
        <circle cx="150" cy="290" r="10" fill="#85B7EB"/>
        <circle cx="150" cy="250" r="14" fill="#042C53"/>
        <line x1="90" y1="230" x2="150" y2="250" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="3 3"/>
        <line x1="210" y1="210" x2="150" y2="250" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="3 3"/>
        <line x1="150" y1="290" x2="150" y2="250" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text x="150" y="340" font-family="Arial" font-size="13" fill="#57544A" text-anchor="middle">Offers from nearby shops,</text>
        <text x="150" y="358" font-family="Arial" font-size="13" fill="#57544A" text-anchor="middle">automatically</text>
      </g>

      <!-- Scene 5: end card / CTA -->
      <g style="animation: pv-fade 12s infinite; animation-delay: 9.6s; opacity:0;">
        <rect x="110" y="210" width="80" height="80" rx="18" fill="#042C53"/>
        <text x="150" y="260" font-family="Arial" font-size="34" font-weight="700" fill="#F0997B" text-anchor="middle">ج</text>
        <rect x="90" y="320" width="120" height="34" rx="10" fill="#D85A30"/>
        <text x="150" y="342" font-family="Arial" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Get your free stand</text>
      </g>

    </svg>

    <div style="position:absolute; bottom:12px; left:12px; right:12px; height:3px; background:rgba(4,44,83,0.12); border-radius:2px; overflow:hidden;">
      <div style="height:100%; background:#D85A30; width:0%; animation: pv-progress 12s infinite linear;"></div>
    </div>
  </div>

  <p style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:10px;">Looping pacing preview — 5 beats over ~12s. Final video: ~38s full cut with voiceover per the script.</p>

</div>

<style>
@keyframes pv-fade {
  0% { opacity: 0; }
  3% { opacity: 1; }
  17% { opacity: 1; }
  20% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes pv-progress {
  0% { width: 0%; }
  100% { width: 100%; }
}
</style>
